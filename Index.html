<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskOS - Gestor de Tareas </title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- ==========================
         AUTH SCREEN
         ========================== -->

<div id="auth-screen" class="screen-active">
    <div class="auth-container">
        <header class="auth-header">
            <div class="logo-mark">T</div>
            <h1 class="logo-text">TaskOS</h1>
            <p class="logo-sub">Sistema de gestión personal</p>
        </header>

        <!-- LOGIN -->
         <div id="login-panel" class="auth-panel active">
            <h2 class="panel-title">LOGIN</h2>
            <div class="field-group">
                <label class="field-label">User</label>
                <input type="text" id="login-user" class="field-input" placeholder="tu_usuario" autocomplete="off" />
            </div>
            <div class="field-group">
                <label class="field-label">Password</label>
                <input type="password" id="login-pass" class="field-input" placeholder="••••••••" />
            </div>
            <div id="login-error" class="auth-error"></div>
            <button class="btn btn-primary btn-full" onclick="App.auth.login()">Enter</button>
            <p class="auth-swith">¿Aún no tienes cuenata con nosotros? <span class="link" onclick="App.auth.showRegister()">Register</span></p>
         </div>

         <!-- REGISTER -->
          <div id="register-panel" class="auth-panel">
            <h2 class="panel-title">Create account</h2>
            <div class="field-group">
                <label class="field-label">Full name</label>
                <input type="text" id="reg-name" class="field-input" placeholder="your name" />
            </div>
            <div class="field-group">
                <label class="field-label">User</label>
                <input type="text" id="reg-user" class="field-input" placeholder="tu_usuario" autocomplete="off" />
            </div>
            <div class="field-group">
                <label class="field-label">Password</label>
                <input type="password" id="reg-pass" class="field-input" placeholder="Min 6 caracters" />
            </div>
            <div class="field-group">
                <label class="field-label">Confirm password</label>
                <input type="password" id="reg-pass2" class="field-input" placeholder="Repit password" />
            </div>
            <div id="reg-error" class="auth-error"></div>
            <button class="btn btn-primary btn-full" onclick="App.auth.register()">Create account</button>
            <p class="auth-swith">¿Ya tienes cuenata? <span class="link" onclick="App.auth.showLogin()">login</span></p>
          </div>
    </div>
</div>

<!-- MAIN SCREEN -->
 <div id="app-screen" class="screen">
    <!-- TOPBAR -->
    <nav class="topbar">
        <div class="topbar-left">
            <div class="logo-mark sm">T</div>
            <span class="topbar-brand">TaskOS</span>
        </div>
        <div class="tapbar-nav">
            <button class="nav-tab active" data-view="sections" onclick="App.ui.switchView('sections')">Apartados</button>
            <button class="nav-tab" data-view="agenda" onclick="App.ui.switchView('agenda')">Agenda</button>
        </div>
        <div class="topbar-right">
            <button class="icon-btn theme-toggle" onclick="App.ui.toggleTheme()" title="Camnbiar tema">
                <span class="theme-icon">◐</span>
            </button>
            <div class="user-chip">
                <span id="user-display"></span>
                <button class="logout-btn" onclick="App.auth.logout()" title="Cerrar sesión">x</button>
            </div>
        </div>
    </nav>

    <!-- VISTA: APARTADOS -->
    <div id="view-sections" class="view active">
        <div class="view-header">
            <div>
                <h2 class="view-title">Mis apartados</h2>
                <p class="view-sub" id="section-count">0 apartados activos</p>
            </div>
            <button class="btn btn-primary" onclick="App.sections.openCreate()">+ Nuevo apartado</button>
        </div>

        <div id="section-grid" class="section-grid">
            <!-- Generado por JS-->
        </div>
    </div>

    <!-- VISTA: DETALLE DE APARTADO -->
     <div id="view-detail" class="view">
        <div class="view-header">
            <div class="breadcrumb">
                <span class="link" onclick="App.ui.switchView('sections')">← Apartados</span>
                <span class="breadcrumb-sep">/</span>
                <span id="detail-title">-</span>
            </div>
            <button class="btn btn-primary" onclick="App.tasks.openCreate">+ Nueva tarea</button>
        </div>

        <!-- Tabs internas -->
         <div class="inner-tabs">
            <button class="inner-tab active" data-tab="tasks" onclick="App.ui.switchTab('tasks')">Tareas</button>
            <button class="inner-tab" data-tab="calendar" onclick="App.ui.switchTab('calendar')">Calendario</button>
         </div>

        <!-- Lista de tareas -->
        <div id="tab-tasks" class="inner-tab-content active">
            <div id="tasks-pending" class="task-group">
                <h3 class="task-group-label">Pendientes</h3>
                <div class="task-list" id="list-pending"></div>
            </div>
            <div id="tasks-done" class="task-group">
                <h3 class="task-group-label">Completadas</h3>
                <div class="task-list" id="list-done"></div>
            </div>
            <div id="tasks-missed" class="task-group">
                <h3 class="task-group-label"> No entregadas</h3>
                <div class="task-list" id="list-missed"></div>
            </div>
        </div>

        <!-- Calendario -->
        
     </div>
 </div>

    
</body>
</html>
