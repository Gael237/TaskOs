<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskOS - Gestor de Tareas </title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- ==========================
         AUTH SCREEN
         ========================== -->

<div id="auth-screen" class="screen-active">
    <div class="auth-container">
        <header class="auth-header">
            <div class="logo-mark">T</div>
            <h1 class="logo-text">TaskOS</h1>
            <p class="logo-sub">Sistema de gestión personal</p>
        </header>

        <!-- LOGIN -->
         <div id="login-panel" class="auth-panel active">
            <h2 class="panel-title">LOGIN</h2>
            <div class="field-group">
                <label class="field-label">User</label>
                <input type="text" id="login-user" class="field-input" placeholder="tu_usuario" autocomplete="off" />
            </div>
            <div class="field-group">
                <label class="field-label">Password</label>
                <input type="password" id="login-pass" class="field-input" placeholder="••••••••" />
            </div>
            <div id="login-error" class="auth-error"></div>
            <button class="btn btn-primary btn-full" onclick="App.auth.login()">Enter</button>
            <p class="auth-swith">¿Aún no tienes cuenata con nosotros? <span class="link" onclick="App.auth.showRegister()">Register</span></p>
         </div>

         <!-- REGISTER -->
          <div id="register-panel" class="auth-panel">
            <h2 class="panel-title">Create account</h2>
            <div class="field-group">
                <label class="field-label">Full name</label>
                <input type="text" id="reg-name" class="field-input" placeholder="your name" />
            </div>
            <div class="field-group">
                <label class="field-label">User</label>
                <input type="text" id="reg-user" class="field-input" placeholder="tu_usuario" autocomplete="off" />
            </div>
            <div class="field-group">
                <label class="field-label">Password</label>
                <input type="password" id="reg-pass" class="field-input" placeholder="Min 6 caracters" />
            </div>
            <div class="field-group">
                <label class="field-label">Confirm password</label>
                <input type="password" id="reg-pass2" class="field-input" placeholder="Repit password" />
            </div>
            <div id="reg-error" class="auth-error"></div>
            <button class="btn btn-primary btn-full" onclick="App.auth.register()">Create account</button>
            <p class="auth-swith">¿Ya tienes cuenata? <span class="link" onclick="App.auth.showLogin()">login</span></p>
          </div>
    </div>
</div>

<!-- MAIN SCREEN -->
 <div id="app-screen" class="screen">
    <!-- TOPBAR -->
    <nav class="topbar">
        <div class="topbar-left">
            <div class="logo-mark sm">T</div>
            <span class="topbar-brand">TaskOS</span>
        </div>
        <div class="tapbar-nav">
            <button class="nav-tab active" data-view="sections" onclick="App.ui.switchView('sections')">Apartados</button>
            <button class="nav-tab" data-view="agenda" onclick="App.ui.switchView('agenda')">Agenda</button>
        </div>
        <div class="topbar-right">
            <button class="icon-btn theme-toggle" onclick="App.ui.toggleTheme()" title="Camnbiar tema">
                <span class="theme-icon">◐</span>
            </button>
            <div class="user-chip">
                <span id="user-display"></span>
                <button class="logout-btn" onclick="App.auth.logout()" title="Cerrar sesión">x</button>
            </div>
        </div>
    </nav>

    <!-- VISTA: APARTADOS -->
    <div id="view-sections" class="view active">
        <div class="view-header">
            <div>
                <h2 class="view-title">Mis apartados</h2>
                <p class="view-sub" id="section-count">0 apartados activos</p>
            </div>
            <button class="btn btn-primary" onclick="App.sections.openCreate()">+ Nuevo apartado</button>
        </div>

        <div id="section-grid" class="section-grid">
            <!-- Generado por JS-->
        </div>
    </div>

    <!-- VISTA: DETALLE DE APARTADO -->
     <div id="view-detail" class="view">
        <div class="view-header">
            <div class="breadcrumb">
                <span class="link" onclick="App.ui.switchView('sections')">← Apartados</span>
                <span class="breadcrumb-sep">/</span>
                <span id="detail-title">-</span>
            </div>
            <button class="btn btn-primary" onclick="App.tasks.openCreate">+ Nueva tarea</button>
        </div>

        <!-- Tabs internas -->
         <div class="inner-tabs">
            <button class="inner-tab active" data-tab="tasks" onclick="App.ui.switchTab('tasks')">Tareas</button>
            <button class="inner-tab" data-tab="calendar" onclick="App.ui.switchTab('calendar')">Calendario</button>
         </div>

        <!-- Lista de tareas -->
        <div id="tab-tasks" class="inner-tab-content active">
            <div id="tasks-pending" class="task-group">
                <h3 class="task-group-label">Pendientes</h3>
                <div class="task-list" id="list-pending"></div>
            </div>
            <div id="tasks-done" class="task-group">
                <h3 class="task-group-label">Completadas</h3>
                <div class="task-list" id="list-done"></div>
            </div>
            <div id="tasks-missed" class="task-group">
                <h3 class="task-group-label"> No entregadas</h3>
                <div class="task-list" id="list-missed"></div>
            </div>
        </div>

        <!-- Calendario -->
        <div id="tab-calendar" class="inner-tab-content">
            <div class="calendar-wrapper">
                <div class="calendar-nav">
                    <button class="icon-btn" onclick="App.calendar.prev()">+</button>
                    <span id="cal-month-label" class="cal-title"></span>
                    <button class="icon-btn" onclick="App.calendar.next()"> -> </button>
                </div>
                <div class="cal-grid" id="cal-grid"></div>
            </div>
        </div>
     </div>

    <!-- VISTA: AGENDA -->
    <div id="view-agenda" class="view">
        <div class="view-header">
            <div>
                <h2 class="view-title"> Agenda Personal </h2>
                <p class="view-sub" id="agenda-date-label"></p>
            </div>
            <div class="btn-group">
                <button class="btn btn-ghost" onclick="App.agenda.clear()">Limpiar agenda</button>
                <button class="btn btn-primary" onclick="App.agenda.openCreate()">+ Nuevo Evento</button>
            </div>
        </div>
        <div id="agenda-list" class="agenda-list"></div>
    </div>

 </div><!-- /app-screen -->

 <!-- MODALES -->
<div id="modal-overlay" class="modal-overlay" onclick="App.modal.closeOnOverlay(event)">
    <!-- Modal: Crear/editar apartado -->
    <div id="modal-section" class="modal">
        <div class="modal-header">
            <h3 id="modal-section-title" class="modal-title">Nuevo apartado</h3>
            <button class="icon-btn" onclick="App.modal.close()">x</button>
        </div>
        <div class="modal-body">
            <div class="field-group">
                <label class="field-label">Descripción (opcional)</label>
                <textarea id="section-desc-input" class="field-group" rows="2" placeholder="Breve descripción..."></textarea>
            </div>
            <div class="field-group">
                <label class="field-label">Color de etiqueta</label>
                <div class="color-picker" id="section-color-picker">
                    <span class="color-dot active" data-color="#D4A853" style="background:#D4A853"></span>
                    <span class="color-dot" data-color="#6B9E8A" style="background:#6B9E8A"></span>
                    <span class="color-dot" data-color="#8A7EC2" style="background:#8A7EC2"></span>
                    <span class="color-dot" data-color="#C27E8A" style="background:#C27E8A"></span>
                    <span class="color-dot" data-color="#7EA8C2" style="background:#7EA8C2"></span>
                    <span class="color-dot" data-color="#888" style="background:#888"></span>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="App.modal.close()">Cancelar</button>
            <button class="btn btn-primary" onclick="App.sections.save()">Guardar</button>
        </div>
    </div>

    <!-- Modal: Crear/Editar tarea -->
    <div id="modal-task" class="modal modal-wide">
        <div class="modal-header">
            <h3 id="modal-task-title" class="modal-title">Nueva tarea</h3>
            <button class="icon-btn" onclick="App.modal.close()">x</button>
        </div>
        <div class="modal-body">
            <div class="form-grid">
                <div class="field-label col-span-2">
                    <label class="field-label">Nombre de la tarea *</label>
                    <input type="text" id="task-name-input" class="field-input" placeholder="Nombre descriptivo" />
                </div>
                <div class="field-group col-span-2">
                    <label class="field-label">Descripción</label>
                    <textarea id="task-desc-input" class="field-input" rows="2" placeholder="Detalles de la tarea..."></textarea>
                </div> <!--Linea 225 de cloude -->
            </div>
        </div>
    </div>
</div>

    
</body>
</html>
